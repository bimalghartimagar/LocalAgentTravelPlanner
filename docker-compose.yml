services:
  app:
    build: .
    container_name: travel-planner-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiKey=${API_KEY:?Set API_KEY in .env or environment}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ConnectionStrings__Conversations=Data Source=/app/data/conversations.db
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/travel/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: travel-planner-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-logs:
  app-data:
