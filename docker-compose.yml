services:
  app:
    build: .
    container_name: travel-planner-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiKey=${API_KEY:?Set API_KEY in .env or environment}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPEN_ROUTER_AI_KEY=${OPEN_ROUTER_AI_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-LocalAgentTravelPlanner}
      - ConnectionStrings__Conversations=Data Source=/app/data/conversations.db
    volumes:
      - app-logs:/app/logs
      - app-data:/app/data
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      # /health/live doesn't touch DB or providers — cheap enough for 30s probes.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Continuous SQLite replication to object storage. Runs as a sidecar sharing the
  # app-data volume; writes are streamed to LITESTREAM_REPLICA_URL (typically s3://
  # or gs://). Set the following in .env to enable:
  #   LITESTREAM_REPLICA_URL=s3://your-bucket/travel-planner
  #   LITESTREAM_ACCESS_KEY_ID=...
  #   LITESTREAM_SECRET_ACCESS_KEY=...
  # Omit the profile flag to skip Litestream: `docker compose up` runs app + nginx only;
  # `docker compose --profile backup up` starts the sidecar too.
  litestream:
    image: litestream/litestream:0.3
    container_name: travel-planner-litestream
    profiles: ["backup"]
    depends_on:
      - app
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID:-}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY:-}
      - LITESTREAM_REPLICA_URL=${LITESTREAM_REPLICA_URL:?Set LITESTREAM_REPLICA_URL in .env when using the backup profile}
    volumes:
      - app-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    command: replicate
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: travel-planner-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-logs:
  app-data:
